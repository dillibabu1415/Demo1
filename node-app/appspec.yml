version: 0.0
os: linux
files:
  - source: /
    destination: /root/deploy_dir/node-app
hooks:
  BeforeInstall:
    - location: scripts/setup_node.sh
      timeout: 180
      runas: root
    - location: scripts/stop_server.sh
      timeout: 180
      runas: root
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 180
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 180
      runas: root

